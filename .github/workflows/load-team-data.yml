
name: Load Soccer Team Intelligence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load historical team intelligence
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/load_team_data.py

      - name: Save team intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team-intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "Load soccer team intelligence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
