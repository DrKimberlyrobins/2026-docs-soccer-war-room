
name: Soccer Scoring Laboratory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scoring-lab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scoring investigation
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
        run: python scripts/scoring_lab.py

      - name: Save scoring data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scoring-lab.json
          if ! git diff --cached --quiet; then
            git commit -m "Update soccer scoring laboratory"
            git push
          fi
