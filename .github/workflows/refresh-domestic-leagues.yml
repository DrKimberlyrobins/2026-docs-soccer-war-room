name: Refresh Soccer Domestic Leagues
on:
  workflow_dispatch:
  schedule:
    - cron: "20 10 * * *"
permissions:
  contents: write
concurrency:
  group: soccer-domestic-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build domestic league statistics
        run: python scripts/build_domestic_expanded.py
      - name: Commit refreshed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/domestic-expanded.json
          git diff --cached --quiet || (git commit -m "Refresh multi-league domestic soccer statistics" && git push)
