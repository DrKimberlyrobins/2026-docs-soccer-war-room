
name: Free Soccer Current-Season Data

on:
  workflow_dispatch:
  schedule:
    # 6:15 AM Central Daylight Time
    # 7:15 AM Central Standard Time
    - cron: "15 11 * * *"
    - cron: "15 13 * * *"

permissions:
  contents: write

concurrency:
  group: free-soccer-data
  cancel-in-progress: false

jobs:
  load-free-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load current-season soccer data
        run: python scripts/free_soccer_loader.py

      - name: Save free soccer intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/free-soccer-intelligence.json

          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update free current-season soccer intelligence"
            git push
          fi
